<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANTINA</title>

<style>
body { font-family: Arial, sans-serif; background: #f4f5f7; margin: 0; padding: 20px; color: #222; }
.container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.caixa { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.linha { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
button { background: #e8590c; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
button:disabled { background: #c9ccd1; cursor: not-allowed; }
button.cinza { background: #6b7280; }
button.link { background: none; color: #c0392b; padding: 0; text-decoration: underline; }
input { padding: 8px; width: 100%; box-sizing: border-box; margin: 8px 0; }
.pedido { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 10px; }
.pequeno { color: #6b7280; font-size: 12px; }
.ok { color: #19855e; font-weight: bold; }
.baixo { color: #c66a17; font-weight: bold; }
.off { color: #8a919e; font-weight: bold; }
.qtd { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.qtd button { padding: 2px 10px; }
.form-produto { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
@media (max-width: 700px) { .container, .form-produto { grid-template-columns: 1fr; } }
</style>
</head>

<body>
<h1>🍔 CANTINA - BLOCO IV</h1>

<div class="container">
  <div class="caixa">
    <h2>CARDÁPIO</h2>
    <div id="CARDÁPIO"></div>
  </div>

  <div class="caixa">
    <h2>CARRINHO</h2>
    <div id="carrinho"></div>
    <p><strong>TOTAL: R$ <span id="total">0.00</span></strong></p>
    <input id="nome" placeholder="NOME DO CLIENTE">
    <button onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
  </div>
</div>

<div class="caixa" style="margin-top: 20px;">
  <h2>PRODUTOS E ESTOQUE</h2>
  <h3 id="titulo-form">CADASTRAR PRODUTO</h3>
  <div class="form-produto">
    <input id="prod-nome" placeholder="NOME DO PRODUTO">
    <input id="prod-preco" type="number" min="0.01" step="0.01" placeholder="PREÇO (R$)">
    <input id="prod-estoque" type="number" min="0" step="1" placeholder="ESTOQUE">
  </div>
  <button onclick="salvarProduto()">SALVAR PRODUTO</button>
  <button id="btn-cancelar-edicao" class="cinza" onclick="limparFormulario()" style="display:none;">CANCELAR EDIÇÃO</button>

  <table>
    <thead><tr><th>PRODUTO</th><th>PREÇO</th><th>ESTOQUE</th><th>STATUS</th><th>AÇÕES</th></tr></thead>
    <tbody id="tabela-produtos"></tbody>
  </table>
</div>

<div class="caixa" style="margin-top: 20px;">
  <h2>PEDIDOS</h2>
  <div id="pedidos"></div>
</div>

<script>
let produtos = [
  { id: 1, nome: "COXINHA",        preco: 6, estoque: 20, ativo: true },
  { id: 2, nome: "PÃO DE QUEIJO",  preco: 4, estoque: 25, ativo: true },
  { id: 3, nome: "PASTEL",         preco: 8, estoque: 12, ativo: true },
  { id: 4, nome: "SUCO",           preco: 5, estoque: 4,  ativo: true },
  { id: 5, nome: "REFRIGERANTE",   preco: 6, estoque: 15, ativo: true },
  { id: 6, nome: "CAFÉ",           preco: 3, estoque: 0,  ativo: true }
];

const etapas = ["AGUARDANDO", "EM PREPARO", "CONCLUÍDO"];
const ESTOQUE_BAIXO = 5;

let carrinho = [];
let pedidos = [];
let proximoNumero = 1;
let proximoIdProduto = 7;
let editandoId = null;

function acharProduto(id) { return produtos.find(p => p.id === id); }
function disponivel(p)    { return p.ativo && p.estoque > 0; }
function dinheiro(valor)  { return "R$ " + valor.toFixed(2).replace(".", ","); }
function agora()          { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function limpar(texto)    { return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function salvarDados() {
  try {
    localStorage.setItem("cantina", JSON.stringify({ produtos, pedidos, proximoNumero, proximoIdProduto }));
  } catch (e) { }
}
function carregarDados() {
  try {
    const d = JSON.parse(localStorage.getItem("cantina"));
    if (d) {
      produtos = d.produtos; pedidos = d.pedidos;
      proximoNumero = d.proximoNumero; proximoIdProduto = d.proximoIdProduto;
    }
  } catch (e) { }
}

function mostrarCardapio() {
  let html = "";
  for (const p of produtos) {
    const texto = disponivel(p)
      ? `<span class="ok">${p.estoque} Disponíveis</span>`
      : `<span class="off">Indisponível</span>`;
    html += `<div class="linha">
               <div>${limpar(p.nome)} - ${dinheiro(p.preco)}<br>${texto}</div>
               <button onclick="adicionarAoCarrinho(${p.id})" ${disponivel(p) ? "" : "disabled"}>ADICIONAR</button>
             </div>`;
  }
  document.getElementById("CARDÁPIO").innerHTML = html;
}

function adicionarAoCarrinho(id) {
  const p = acharProduto(id);
  const item = carrinho.find(i => i.id === id);
  if (item) {
    if (item.quantidade >= p.estoque) { alert("ESTOQUE INSUFICIENTE!"); return; }
    item.quantidade++;
  } else {
    carrinho.push({ id: id, quantidade: 1 });
  }
  mostrarCarrinho();
}

function mudarQuantidade(id, valor) {
  const p = acharProduto(id);
  const item = carrinho.find(i => i.id === id);
  const nova = item.quantidade + valor;
  if (nova < 1) return;
  if (nova > p.estoque) { alert("ESTOQUE INSUFICIENTE!"); return; }
  item.quantidade = nova;
  mostrarCarrinho();
}

function removerDoCarrinho(id) {
  carrinho = carrinho.filter(i => i.id !== id);
  mostrarCarrinho();
}

function mostrarCarrinho() {
  let html = "";
  let total = 0;
  for (const item of carrinho) {
    const p = acharProduto(item.id);
    const subtotal = p.preco * item.quantidade;
    total += subtotal;
    html += `<div class="linha">
               <div>
                 <strong>${limpar(p.nome)}</strong> - ${dinheiro(p.preco)} CADA
                 <div class="pequeno">QUANTIDADE</div>
                 <div class="qtd">
                   <button onclick="mudarQuantidade(${p.id}, -1)" ${item.quantidade <= 1 ? "disabled" : ""}>−</button>
                   <strong>${item.quantidade}</strong>
                   <button onclick="mudarQuantidade(${p.id}, 1)" ${item.quantidade >= p.estoque ? "disabled" : ""}>+</button>
                 </div>
                 <button class="link" onclick="removerDoCarrinho(${p.id})">REMOVER</button>
               </div>
               <strong>${dinheiro(subtotal)}</strong>
             </div>`;
  }
  document.getElementById("carrinho").innerHTML = html || "<p>CARRINHO VAZIO.</p>";
  document.getElementById("total").textContent = total.toFixed(2);
}

function ajustarCarrinho() {
  carrinho = carrinho.filter(i => { const p = acharProduto(i.id); return p && disponivel(p); });
  for (const i of carrinho) {
    const p = acharProduto(i.id);
    if (i.quantidade > p.estoque) i.quantidade = p.estoque;
  }
}

function finalizarPedido() {
  const nome = document.getElementById("nome").value.trim();

  if (carrinho.length === 0) { alert("NÃO HÁ ITENS NO CARRINHO!"); return; }
  if (nome === "")           { alert("DIGITE O NOME DO CLIENTE!"); return; }

  for (const i of carrinho) {
    const p = acharProduto(i.id);
    if (!disponivel(p) || p.estoque < i.quantidade) { alert("ESTOQUE INSUFICIENTE PARA " + p.nome + "!"); return; }
  }

  let total = 0;
  const itens = [];
  for (const i of carrinho) {
    const p = acharProduto(i.id);
    p.estoque -= i.quantidade;
    total += p.preco * i.quantidade;
    itens.push({ id: p.id, nome: p.nome, preco: p.preco, quantidade: i.quantidade });
  }

  pedidos.push({ numero: proximoNumero, cliente: nome, itens: itens, total: total, hora: agora(), status: "AGUARDANDO" });
  proximoNumero++;

  carrinho = [];
  document.getElementById("nome").value = "";
  mostrarTudo();
}

function mostrarPedidos() {
  let html = "";
  for (const p of pedidos) {
    const aberto = p.status === "AGUARDANDO" || p.status === "EM PREPARO";
    const botoes = aberto
      ? `<button onclick="avancarStatus(${p.numero})">AVANÇAR STATUS</button>
         <button class="cinza" onclick="cancelarPedido(${p.numero})">CANCELAR PEDIDO</button>`
      : "";
    const lista = p.itens.map(i => `${i.quantidade}x ${limpar(i.nome)}`).join(", ");

    html += `<div class="pedido">
               <strong>Pedido #${p.numero}</strong> - ${limpar(p.cliente)} <span class="pequeno">(${p.hora})</span><br>
               Itens: ${lista}<br>
               Total: <strong>${dinheiro(p.total)}</strong><br>
               Status: <strong>${p.status}</strong> ${botoes}
             </div>`;
  }
  document.getElementById("pedidos").innerHTML = html || "<p>NENHUM PEDIDO REGISTRADO.</p>";
}

function avancarStatus(numero) {
  const pedido = pedidos.find(p => p.numero === numero);
  pedido.status = etapas[etapas.indexOf(pedido.status) + 1];
  mostrarTudo();
}

function cancelarPedido(numero) {
  if (!confirm("CANCELAR O PEDIDO #" + numero + "?")) return;
  const pedido = pedidos.find(p => p.numero === numero);
  for (const i of pedido.itens) {
    const p = acharProduto(i.id);
    if (p) p.estoque += i.quantidade;
  }
  pedido.status = "CANCELADO";
  mostrarTudo();
}

function mostrarProdutos() {
  let html = "";
  for (const p of produtos) {
    let status;
    if (!p.ativo)                       status = `<span class="off">DESATIVADO</span>`;
    else if (p.estoque === 0)           status = `<span class="off">ESGOTADO</span>`;
    else if (p.estoque <= ESTOQUE_BAIXO) status = `<span class="baixo">ESTOQUE BAIXO</span>`;
    else                                status = `<span class="ok">DISPONÍVEL</span>`;

    html += `<tr>
               <td>${limpar(p.nome)}</td><td>${dinheiro(p.preco)}</td><td>${p.estoque}</td><td>${status}</td>
               <td>
                 <button onclick="editarProduto(${p.id})">EDITAR</button>
                 <button class="cinza" onclick="alternarProduto(${p.id})">${p.ativo ? "DESATIVAR" : "ATIVAR"}</button>
               </td>
             </tr>`;
  }
  document.getElementById("tabela-produtos").innerHTML = html;
}

function salvarProduto() {
  const nome = document.getElementById("prod-nome").value.trim().toUpperCase();
  const preco = Number(document.getElementById("prod-preco").value);
  const estoque = Number(document.getElementById("prod-estoque").value);

  if (nome === "" || !(preco > 0) || !Number.isInteger(estoque) || estoque < 0) {
    alert("CONFIRA OS DADOS DO PRODUTO!");
    return;
  }

  if (editandoId !== null) {
    const p = acharProduto(editandoId);
    p.nome = nome; p.preco = preco; p.estoque = estoque;
  } else {
    produtos.push({ id: proximoIdProduto, nome: nome, preco: preco, estoque: estoque, ativo: true });
    proximoIdProduto++;
  }
  limparFormulario();
  mostrarTudo();
}

function editarProduto(id) {
  const p = acharProduto(id);
  editandoId = id;
  document.getElementById("prod-nome").value = p.nome;
  document.getElementById("prod-preco").value = p.preco;
  document.getElementById("prod-estoque").value = p.estoque;
  document.getElementById("titulo-form").textContent = "EDITAR PRODUTO";
  document.getElementById("btn-cancelar-edicao").style.display = "inline-block";
}

function limparFormulario() {
  editandoId = null;
  document.getElementById("prod-nome").value = "";
  document.getElementById("prod-preco").value = "";
  document.getElementById("prod-estoque").value = "";
  document.getElementById("titulo-form").textContent = "CADASTRAR PRODUTO";
  document.getElementById("btn-cancelar-edicao").style.display = "none";
}

function alternarProduto(id) {
  const p = acharProduto(id);
  p.ativo = !p.ativo;
  mostrarTudo();
}

function mostrarTudo() {
  ajustarCarrinho();
  mostrarCardapio();
  mostrarCarrinho();
  mostrarProdutos();
  mostrarPedidos();
  salvarDados();
}

carregarDados();
mostrarTudo();
</script>
</body>
</html>
